[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gyromote"
version = "0.1.0"
description = "Use an LG Magic Remote MR25GA as a gyro mouse and button pad on macOS (BLE HID, polling)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nik Nikitenok" }]
keywords = ["macos", "remote", "gyro", "air-mouse", "hid", "bluetooth"]
classifiers = [
  "Operating System :: MacOS",
  "Environment :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
  "hidapi>=0.14",
  "pyobjc-framework-Cocoa>=10",
  "pyobjc-framework-Quartz>=10",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]

[project.scripts]
gyromote = "gyromote.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gyromote"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
